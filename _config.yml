title: Fauzy Madani
brief-intro: Personal notes and observations
description: The personal website of Fauzy Madani.
baseurl: ""
url: "https://fauzymadani.github.io"

permalink: /:year/:month/:day/:title/

github_username: fauzymadani
email: fauzymadani3@gmail.com
description_footer: Notes and experiments by Fauzy.
license:
  name: CC BY-NC 4.0
  url: https://creativecommons.org/licenses/by-nc/4.0/

google_analytics_id:
baidu_tongji_id:
goatcounter: "https://fauzy.goatcounter.com/count"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

category_dir: category/
tag_dir: tag/
excerpt_separator: "\n\n\n\n"

paginate: 10
plugins:
  - jekyll-paginate

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - build.el
  - build.sh
  - content
  - public
  - vendor
