title: Fauzy
brief-intro: Notes on Emacs, Linux, and useful tools
description: A personal blog about Emacs, Linux, games, and useful tools.
baseurl: ""
url: "https://fauzymadani.github.io"

permalink: /:year/:month/:day/:title/

github_username: fauzymadani
email: fauzymadani3@gmail.com
description_footer: Notes and experiments by Fauzy.

disqus_shortname:
duoshuo_shortname:
google_analytics_id:
baidu_tongji_id:

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

category_dir: category/
tag_dir: tag/
excerpt_separator: "\n\n\n\n"

paginate: 10
plugins:
  - jekyll-paginate

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - build.el
  - build.sh
  - content
  - public
  - vendor
